<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALJODA Admin</title><link rel="stylesheet" href="/styles.css"></head><body>
<header class="navbar"><div></div><a class="brand" href="/"><img src="/assets/logo.jpeg"></a><div><a class="text-btn" href="/">Store</a></div></header>
<main class="section"><div id="login" class="modal-card" style="width:100%;max-width:500px;margin:auto"><h2>Admin Login</h2><p>Use the admin credentials configured on the server.</p><form id="loginForm"><input required name="email" type="email" placeholder="Email"><input required name="password" type="password" placeholder="Password"><button class="checkout">Login</button></form></div>
<div id="dash" style="display:none"><div class="section-head"><div><h2>ALJODA Admin Dashboard</h2><p>Add products, update stock and manage orders.</p></div><button class="text-btn" onclick="logout()">Logout</button></div>
<section class="modal-card" style="width:100%;margin-bottom:25px"><h3>Add Product</h3><form id="pf" class="admin-form">
<input required name="name" placeholder="Product name"><input name="brand" placeholder="Brand"><select name="category"><option>Medicines</option><option>Skincare & Beauty</option><option>Vitamins & Supplements</option><option>Baby Care</option><option>Medical Devices</option><option>Personal Care</option></select><input required name="price" type="number" placeholder="Price IQD"><input name="old_price" type="number" placeholder="Old price (optional)"><input required name="stock" type="number" placeholder="Stock"><input name="image" placeholder="Image URL (or upload below)"><textarea name="description" placeholder="Description"></textarea><label><input type="checkbox" name="featured"> Featured</label><button class="checkout">Save Product</button></form></section>
<h3>Products</h3><div id="plist"></div><h3 style="margin-top:30px">Orders</h3><div id="olist"></div></div></main>
<script>
async function api(url,opt={}){const r=await fetch(url,opt);const d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d}
async function check(){try{await api("/api/admin/me");document.getElementById("login").style.display="none";document.getElementById("dash").style.display="block";refresh()}catch{}}
document.getElementById("loginForm").onsubmit=async e=>{e.preventDefault();try{await api("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});check()}catch(x){alert(x.message)}}
document.getElementById("pf").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.featured=e.target.featured.checked;d.price=Number(d.price);d.stock=Number(d.stock);if(d.old_price)d.old_price=Number(d.old_price);try{await api("/api/admin/products",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});e.target.reset();refresh()}catch(x){alert(x.message)}}
async function refresh(){const ps=await api("/api/admin/products"),os=await api("/api/admin/orders");document.getElementById("plist").innerHTML=ps.map(p=>`<div class="cart-row"><span><b>${p.name}</b><br>${p.category} · Stock: ${p.stock}</span><b>${new Intl.NumberFormat().format(p.price)} IQD</b><button onclick="delP(${p.id})">Hide</button></div>`).join("")||"<p>No products.</p>";document.getElementById("olist").innerHTML=os.map(o=>`<div class="cart-row"><span><b>Order #${o.id}</b> — ${o.status}<br>${o.customer_name} · ${o.phone}<br>${o.area} · ${o.address}<br>Total: ${new Intl.NumberFormat().format(o.total)} IQD</span><select onchange="setStatus(${o.id},this.value)">${["New","Confirmed","Preparing","Out for Delivery","Delivered","Cancelled"].map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}</select></div>`).join("")||"<p>No orders yet.</p>"}
async function delP(id){await api("/api/admin/products/"+id,{method:"DELETE"});refresh()}
async function setStatus(id,status){await api("/api/admin/orders/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status})});refresh()}
async function logout(){await api("/api/admin/logout",{method:"POST"});location.reload()}check();
</script></body></html>
